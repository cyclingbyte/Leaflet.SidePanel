name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  merge-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job: ['lint:check', 'format:check', 'type:check', 'test:check']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm install

      - name: Run ${{ matrix.job }}
        run: npm run ${{ matrix.job }}
